# herdr — agent multiplexer
#
# NOTE: ~/.config/herdr/ is NOT a pure config directory. herdr resolves its
# session data_dir() to config_dir() (src/session.rs), so session.json,
# session-history.json and the live herdr.sock all land next to this file. Only
# THIS file is symlinked out of the dotfiles checkout — never the directory.

# Don't run onboarding
onboarding = false
[terminal]
default_shell = "zsh"

[keys]
# Match tmux (`set -g prefix C-Space` in ../tmux/tmux.conf) rather than herdr's
# ctrl+b default
prefix = "ctrl+space"

# Both worktree actions ship unbound; new_worktree already has prefix+shift+g by
# default. open_worktree is the one that earns its key here: it lists every
# linked worktree of the current repo, including checkouts herdr did not create
# — the ~/code/bitmover/BitMover/.claude/worktrees/* ones Claude Code leaves
# behind are otherwise invisible to the sidebar. Already-open checkouts get
# focused, closed ones open in the same workspace group.
open_worktree = "prefix+shift+o"

# Deliberately a shift+letter: the docs call ctrl+letter and explicit modified
# chords the reliable family, while punctuation-with-modifiers "may depend on
# your terminal/tmux setup" — which matters because this host is also attached
# to over `herdr --remote` from the Mac. shift+k has no shift-bound neighbours,
# so a slipped keystroke lands on nothing rather than on another action.
#
# Note this is destructive beyond what "remove" suggests: herdr runs `git
# worktree remove`, "requesting safe removal first, then forcing removal if
# necessary due to modified or untracked files". One confirmation dialog is all
# that stands between this key and discarded uncommitted work in an agent's
# checkout. Branches are not deleted, and it only touches herdr-managed
# checkouts, so the .claude/worktrees/* ones above are not removable this way.
remove_worktree = "prefix+shift+k"

[theme]
# Closest built-in to zellij's tokyo-night-storm. auto_switch is off: Ghostty
# is pinned dark, so light/dark flipping would only ever fight it.
name = "tokyo-night"
auto_switch = false

[ui]
# Attention queue, not the "spaces" default: with four agents live the useful
# question is which one is blocked or done. `workspace` is still in the rows
# below, so grouping is not lost.
agent_panel_sort = "priority"

# Stock rows are [["state_icon", "workspace", "tab"], ["agent"]] — they say
# where a pane is, not what it is doing. Both agents below write a task summary
# to the OSC title, worth a row each; the token differs because the noise does.
#
# claude prefixes a state glyph (◑, ✳) that state_icon already draws, so it
# wants _stripped. copilot's noise is the trailing " - GitHub Copilot", which
# _stripped (leading glyphs only) cannot reach — hence the raw token, and no
# ["agent"] row, since that suffix already names it.
#
# Sample a candidate while it is WORKING before adding it here. A freshly
# started pane shows only the product name, which makes a good title look
# like a constant.
[ui.sidebar.agents.rows_by_agent]
claude  = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]
copilot = [["state_icon", "workspace", "tab"], ["terminal_title"]]

[session]
# The pane layout comes back after a server restart either way; this also
# resumes the agent conversations that were running in those panes.
resume_agents_on_restore = true

[remote]
# Leave our own ~/.ssh/config alone.
manage_ssh_config = false
